<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="api-base-url" content="http://localhost:8080">
  <title>SantanDar</title>
  <link rel="stylesheet" href="resources/css/styles.css">
</head>
<body class="is-login">
  <div id="view-login-host"></div>

  <p id="view-load-error" class="view-load-error" role="alert" hidden></p>

  <div id="app-shell" class="app-shell" hidden>
    <header class="topbar">
      <button id="nav-toggle" class="nav-toggle" type="button" aria-expanded="false" aria-controls="sidebar">
        <span class="sr-only">Abrir menú</span>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      </button>
      <div class="brand">
        <div class="logo-slot logo-slot--header" role="img" aria-label="Logo de SantanDar"></div>
        <span class="brand-name">SantanDar</span>
      </div>
    </header>

    <div class="app-body">
      <div id="nav-backdrop" class="nav-backdrop" hidden></div>
      <aside id="sidebar" class="sidebar">
        <nav class="side-nav" aria-label="Secciones principales">
          <button class="nav-item" type="button" data-view="inicio">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 11.2 12 4.5l8 6.7V20a1 1 0 0 1-1 1h-5.2v-6.2H10.2V21H5a1 1 0 0 1-1-1v-8.8Z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>
            <span>Inicio</span>
          </button>
          <button class="nav-item" type="button" data-view="inventario">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8.2 12 4l8 4.2v7.6L12 20l-8-4.2V8.2Z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M12 12.2 20 8.2M12 12.2V20M12 12.2 4 8.2" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>
            <span>Inventario</span>
          </button>
          <button class="nav-item" type="button" data-view="despacho">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7.5h11.2v8.2H3V7.5Z" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M14.2 10h3.2l2.6 2.8v2.9h-5.8V10Z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><circle cx="7.2" cy="17.6" r="1.5" fill="none" stroke="currentColor" stroke-width="1.6"/><circle cx="16.6" cy="17.6" r="1.5" fill="none" stroke="currentColor" stroke-width="1.6"/></svg>
            <span>Despacho</span>
          </button>
          <button class="nav-item" type="button" data-view="usuarios" data-admin-only hidden>
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8.2" r="3" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M5.5 19c1.3-2.8 3.5-4.1 6.5-4.1s5.2 1.3 6.5 4.1" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
            <span>Usuarios</span>
          </button>
        </nav>
        <div class="sidebar-footer">
          <button id="logout-button" class="logout-button" type="button">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 4H5.5A1.5 1.5 0 0 0 4 5.5v13A1.5 1.5 0 0 0 5.5 20H10M14 16l4-4-4-4M18 12H9" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
            <span>Cerrar sesión</span>
          </button>
        </div>
      </aside>

      <main class="app-main">
        <div data-view-host="inicio"></div>

        <div data-view-host="inventario"></div>

        <div data-view-host="registrar"></div>

        <div data-view-host="despacho"></div>

        <div data-view-host="usuarios"></div>
      </main>
    </div>
  </div>

  <div id="dialog-host">  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script src="resources/js/view-loader.js"></script>
</body>
</html>
